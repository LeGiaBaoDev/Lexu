<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
    
</head>
<body>
    <header class="header">
        <div class="container w-100">
            <div class="header-top d-flex justify-content-between align-items-center">
                <div class="logo">
                    <a href="index.html">
                        <img src="../assets/images/logo.png" alt="Logo" style=" height: 70px;">
                    </a>
                </div>
                <nav class="nav d-flex justify-content-center align-items-center">
                    <ul class="menu-list d-flex justify-content-center align-items-center m-0 p-0">
                        <li class="menu-item d-flex p-3 "><a href="" class="menu-link text-decoration-none text-dark fs-5">Products</a></li>
                        <li class="menu-item d-flex p-3 "><a href="" class="menu-link text-decoration-none text-dark fs-5">Sale</a></li>
                        <li class="menu-item d-flex p-3 "><a href="" class="menu-link text-decoration-none text-dark fs-5">Account</a></li>
                        <li class="menu-item d-flex p-3 "><a href="" class="menu-link text-decoration-none text-dark fs-5">About Us</a></li>
                    </ul>
                </nav>
                <div class="search d-flex justify-content-center align-items-center">
                    <form action="" class="form-search d-flex justify-content-center align-items-center">
                        <input type="text" placeholder="Search..." class="form-control">
                        <button type="submit" class="btn btn-primary bg-secondary border-secondary" ">
                            <i class="fa-solid fa-magnifying-glass" style="color: rgb(255, 255, 255);"></i>
                        </button>
                    </form>
                </div>
                <div class="cart d-flex justify-content-center align-items-center">
                    <a href="../html/cart.html" class="fs-4">
                        <i class="fa-brands fa-opencart text-dark"></i>
                    </a>
                </div>

            </div>
        </div>
    </header>
    

    <script src="../js/jquery-4.0.0.min.js"></script>  
</body>
</html>
